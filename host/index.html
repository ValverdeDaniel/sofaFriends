<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SofaFriends - Host Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #lobby {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
        }

        #lobby.hidden {
            display: none;
        }

        .room-code-display {
            font-size: 72px;
            font-weight: bold;
            letter-spacing: 12px;
            color: #4ECDC4;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(78, 205, 196, 0.5);
        }

        .instruction {
            font-size: 24px;
            color: #bbb;
            margin: 10px 0;
        }

        #qr-code {
            margin: 30px 0;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        #player-list {
            display: flex;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }

        .player-slot {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .player-slot.filled {
            transform: scale(1.05);
        }

        .player-slot.empty {
            background: #2a2a3e;
            color: #666;
            border: 2px dashed #444;
        }

        .player-name {
            margin-top: 10px;
        }

        #start-btn {
            margin-top: 40px;
            padding: 20px 60px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }

        #start-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.6);
        }

        #start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #4ECDC4;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
        }

        .loading {
            color: white;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="status">Connecting...</div>
        <div id="lobby">
            <h1 style="font-size: 48px; margin-bottom: 20px;">🎮 SofaFriends</h1>
            <p class="instruction">Scan QR or enter code on your phone:</p>
            <div class="room-code-display" id="room-code">------</div>
            <div id="qr-code"></div>
            <div id="player-list"></div>
            <button id="start-btn" disabled>Waiting for players...</button>
        </div>
        <div id="game-container">
            <canvas id="game-canvas"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script type="module" src="./game.js"></script>
</body>
</html>
