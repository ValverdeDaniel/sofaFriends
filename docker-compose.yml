version: '3.8'

services:
  # Redis for room storage
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # FastAPI game server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "9000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./server:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Host client (game screen)
  host:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "9001:3000"
    volumes:
      - ./host:/app
    command: npx -y http-server -p 3000 --cors

  # Controller client (phone)
  controller:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3001:3001"
    volumes:
      - ./controller:/app
    command: npx -y http-server -p 3001 --cors

volumes:
  redis_data: